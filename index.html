<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopZone - Mini E-Commerce</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Main Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 d-flex align-items-center gap-2" href="#">
                <i class="bi bi-cart-check-fill text-warning"></i> ShopZone
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About Us</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center position-relative cursor-pointer" id="cart-btn"
                    data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas" role="button">
                    <i class="bi bi-bag text-white fs-4 cart-icon"></i>
                    <span
                        class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark"
                        id="cart-badge">
                        0
                        <span class="visually-hidden">items in cart</span>
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero / Filter Section -->
    <header class="bg-light py-5 animate-fade-in">
        <div class="container text-center">
            <h1 class="display-4 fw-bold mb-3">Discover the Best Products</h1>
            <p class="lead text-muted mb-5">Premium quality curated just for you.</p>

            <div class="row justify-content-center mb-4">
                <div class="col-md-6 col-lg-5">
                    <div class="input-group search-bar shadow-sm">
                        <span class="input-group-text bg-white border-end-0" id="search-addon"><i
                                class="bi bi-search text-muted"></i></span>
                        <input type="text" id="search-input" class="form-control border-start-0 ps-0"
                            placeholder="Search for products..." aria-label="Search" aria-describedby="search-addon">
                    </div>
                </div>
            </div>

            <!-- Categories -->
            <div class="d-flex flex-wrap justify-content-center gap-2" id="category-filters">
                <button class="btn btn-outline-primary active category-btn" data-category="All">All</button>
                <button class="btn btn-outline-primary category-btn" data-category="Electronics">Electronics</button>
                <button class="btn btn-outline-primary category-btn" data-category="Clothing">Clothing</button>
                <button class="btn btn-outline-primary category-btn" data-category="Books">Books</button>
                <button class="btn btn-outline-primary category-btn" data-category="Home">Home</button>
            </div>
        </div>
    </header>

    <!-- Product Grid Section -->
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold" id="current-category-title">All Products</h2>
            <div id="loading-spinner" class="spinner-border text-primary d-none" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4" id="product-grid">
            <!-- Products injected here via AJAX -->
        </div>
    </main>

    <!-- Cart Offcanvas -->
    <div class="offcanvas offcanvas-end shadow-lg" tabindex="-1" id="cartOffcanvas"
        aria-labelledby="cartOffcanvasLabel">
        <div class="offcanvas-header border-bottom py-3">
            <h5 class="offcanvas-title fw-bold d-flex align-items-center gap-2" id="cartOffcanvasLabel">
                <i class="bi bi-cart3"></i> Your Cart <span class="badge bg-primary rounded-pill fs-6 ms-2"
                    id="cart-count-title">0</span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body cart-body d-flex flex-column p-0">
            <!-- Cart Items -->
            <div class="cart-items flex-grow-1 overflow-auto p-3" id="cart-items-container">
                <!-- Items injected here via AJAX -->
                <div class="text-center text-muted py-5 empty-cart-message">
                    <i class="bi bi-cart-x fs-1 mb-3"></i>
                    <p>Your cart is empty.</p>
                </div>
            </div>

            <!-- Cart Footer -->
            <div class="cart-footer p-3 bg-light border-top">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-bold fs-5">Subtotal</span>
                    <span class="fw-bold fs-4 text-success" id="cart-total">$0.00</span>
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-primary btn-lg fw-bold" id="checkout-btn">Checkout</button>
                    <button class="btn btn-outline-danger" id="clear-cart-btn">Clear Cart</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/search-filter.js"></script>
</body>

</html>
