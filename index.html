<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopZone - Mini E-Commerce</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500;600&family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Main Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm py-0">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-1 py-3" href="#">
                <span class="brand-snow">❄</span> ShopZone
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About Us</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center position-relative cursor-pointer" id="cart-btn"
                    data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas" role="button">
                    <i class="bi bi-bag fs-4 cart-icon"></i>
                    <span
                        class="position-absolute top-0 start-100 translate-middle badge rounded-pill"
                        id="cart-badge">
                        0
                        <span class="visually-hidden">items in cart</span>
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero / Filter Section -->
    <header class="hero-section py-5 animate-fade-in">
        <!-- Snowflakes -->
        <div class="snow-deco snow-1">❄</div>
        <div class="snow-deco snow-2">❄</div>
        <div class="snow-deco snow-3">❄</div>
        <div class="snow-deco snow-4">❄</div>

        <div class="container text-center py-3">
            <h1 class="display-4 hero-headline mb-3">Discover <span class="winter-highlight">Winter</span> Luxury</h1>
            <p class="lead hero-subhead mb-5">Premium quality curated just for the season.</p>

            <div class="row justify-content-center mb-5">
                <div class="col-md-8 col-lg-6">
                    <div class="input-group search-bar shadow-sm">
                        <span class="input-group-text pe-2" id="search-addon"><i
                                class="bi bi-search text-muted"></i></span>
                        <input type="text" id="search-input" class="form-control border-start-0 ps-0 text-dark border-0"
                            placeholder="Search for products..." aria-label="Search" aria-describedby="search-addon">
                    </div>
                </div>
            </div>

            <!-- Categories -->
            <div class="d-flex flex-wrap justify-content-center gap-2 mt-3" id="category-filters">
                <button class="btn category-btn active" data-category="All">All</button>
                <button class="btn category-btn" data-category="Electronics">Electronics</button>
                <button class="btn category-btn" data-category="Clothing">Clothing</button>
                <button class="btn category-btn" data-category="Books">Books</button>
                <button class="btn category-btn" data-category="Home">Home</button>
            </div>
        </div>
    </header>

    <!-- Product Grid Section -->
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold" id="current-category-title">All Products</h2>
            <div id="loading-spinner" class="spinner-border text-primary d-none" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xxl-4 g-4" id="product-grid">
            <!-- Products injected here via AJAX -->
        </div>
    </main>

    <!-- Cart Offcanvas -->
    <div class="offcanvas offcanvas-end shadow-lg" tabindex="-1" id="cartOffcanvas"
        aria-labelledby="cartOffcanvasLabel">
        <div class="offcanvas-header py-3">
            <h5 class="offcanvas-title d-flex align-items-center gap-2" id="cartOffcanvasLabel">
                Your Cart 🛒 <span class="badge bg-primary rounded-pill fs-6 ms-2"
                    id="cart-count-title">0</span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body cart-body d-flex flex-column p-0">
            <!-- Cart Items -->
            <div class="cart-items flex-grow-1 overflow-auto p-3" id="cart-items-container">
                <!-- Items injected here via AJAX -->
                <div class="empty-state">
                    <i class="bi bi-cart-x empty-state-icon"></i>
                    <h4 class="empty-state-title">Your cart is empty</h4>
                    <p class="empty-state-subtext">Looks like you haven't added anything yet.</p>
                </div>
            </div>

            <!-- Cart Footer -->
            <div class="cart-footer">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fs-5" style="font-family: var(--fs-h3); color: var(--text-secondary);">Subtotal</span>
                    <span class="fs-4" id="cart-total">$0.00</span>
                </div>
                <div class="d-grid gap-3 text-center">
                    <button class="btn btn-checkout" id="checkout-btn">Checkout</button>
                    <button class="btn mt-1" id="clear-cart-btn">Clear Cart</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/search-filter.js"></script>
</body>

</html>
